services:
  db:
    image: postgres:16-alpine
    container_name: week1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: week1_users
    ports:
      - '5433:5432'
    volumes:
      - week1_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d week1_users']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: week1-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/week1_users?schema=public
      JWT_SECRET: week1-docker-secret-change-me
      JWT_EXPIRES_IN: 1d
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: Admin123!
      SEED_ADMIN_NAME: Admin User
    ports:
      - '3000:3000'

volumes:
  week1_pgdata:
