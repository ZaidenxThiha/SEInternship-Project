services:
  db:
    image: pgvector/pgvector:pg16
    container_name: week3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: week3_rag
    ports:
      - '5434:5432'
    volumes:
      - week3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d week3_rag']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  week3_pgdata:
